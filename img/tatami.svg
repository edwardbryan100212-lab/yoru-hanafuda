<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <!-- Two rows of 2:1 tatami mats in running bond. Reeds run across each mat (fine vertical grain),
       warp threads run along it, and the long edges carry the dark cloth border (heri). -->
  <defs>
    <filter id="reed" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.42 0.005" numOctaves="3" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" in="n" values="0 0 0 0 0.42  0 0 0 0 0.40  0 0 0 0 0.20  0 0 0 1.15 -0.3"/>
    </filter>
    <filter id="blot" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.02" numOctaves="2" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.98  0 0 0 0 0.95  0 0 0 0 0.75  0 0 0 0.55 -0.2"/>
    </filter>
    <pattern id="warp" width="560" height="16" patternUnits="userSpaceOnUse">
      <rect y="8" width="560" height="1" fill="#6e6a3a" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="heri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c362b"/><stop offset=".5" stop-color="#3b4838"/><stop offset="1" stop-color="#232b22"/>
    </linearGradient>
    <g id="mat">
      <rect width="560" height="280" fill="#c4be88"/>
      <rect width="560" height="280" filter="url(#reed)"/>
      <rect width="560" height="280" fill="url(#warp)"/>
      <rect width="560" height="280" filter="url(#blot)"/>
      <rect y="0" width="560" height="13" fill="url(#heri)"/>
      <rect y="267" width="560" height="13" fill="url(#heri)"/>
      <rect y="13" width="560" height="1" fill="#000" fill-opacity=".18"/>
      <rect y="266" width="560" height="1" fill="#000" fill-opacity=".18"/>
    </g>
  </defs>
  <use href="#mat"/>
  <g transform="translate(0 280)">
    <svg x="0" y="0" width="560" height="280" viewBox="280 0 560 280"><use href="#mat"/><use href="#mat" x="560"/></svg>
    <rect x="279" y="14" width="2" height="252" fill="#5c5730" fill-opacity=".35"/>
  </g>
  <rect x="0" y="14" width="1" height="252" fill="#5c5730" fill-opacity=".35"/>
</svg>
