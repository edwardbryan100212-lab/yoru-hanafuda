<!doctype html><meta charset="utf-8"><title>All cards</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400&display=swap" rel="stylesheet">
<style>body{background:#ece4d1;margin:12px;font-family:'Zen Kaku Gothic New',sans-serif;color:#241d18}
.g{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:auto repeat(4,auto);gap:6px 8px;max-width:1300px;margin:0 auto}h1{font-family:'Shippori Mincho B1',serif;text-align:center;font-size:22px;margin:4px 0 12px}p{text-align:center;font-size:12px;color:#5b5046}@media(max-width:700px){.g{grid-template-columns:repeat(4,1fr);grid-auto-flow:row;grid-template-rows:none}.m{grid-column:1/-1}}
.m{font-size:11px;text-align:center}.m b{font-family:'Shippori Mincho B1',serif;font-size:20px;display:block}
figure{margin:0;text-align:center}img{width:100%;border-radius:5px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
figcaption{font-size:11px;margin-top:3px;font-family:'Shippori Mincho B1',serif}</style>
<h1>花札 四十八枚 <span style="font-family:Zen Kaku Gothic New;font-size:15px;font-weight:400">All 48 cards</span></h1>
<div class="g" id="g"></div>
<p>Card art by Louie Mantia, <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>, colours softened.</p>
<script type="module">import {CARDS,MONTHS,cardSVG} from './js/cards.js?v=7';
const g=document.getElementById('g');
MONTHS.forEach((m,i)=>{g.insertAdjacentHTML('beforeend',`<div class="m"><b>${m.flower}</b>${m.n}. ${m.en}</div>`);
for(let j=0;j<4;j++){const c=CARDS[i*4+j];g.insertAdjacentHTML('beforeend',`<figure>${cardSVG(c.id,{label:false})}<figcaption>${c.jp}</figcaption></figure>`)}});</script>
